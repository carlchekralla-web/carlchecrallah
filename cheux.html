<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHEUX — Woman of My Dreams</title>
  <link rel="icon" type="image/jpeg" href="assets/images/avatar.jpg">
  <meta name="description" content="CHEUX — Woman of My Dreams, now available on all platforms">
  <style>
    @font-face {
      font-family: 'KomuB';
      src: url('assets/fonts/komu_b.otf') format('opentype');
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'IBM Plex Sans';
      src: url('assets/fonts/IBM_Plex_Sans/IBMPlexSans-VariableFont_wdth,wght.ttf') format('truetype');
      font-weight: 100 700; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #000; color: #fff; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow-x: hidden; }

    /* ── Header ── */
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: #0a0a0a; border-bottom: 1px solid #1f1f1f; }
    .site-header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1420px; margin: 0 auto; padding: 0 1.5rem; height: 64px; position: relative; }
    @media (min-width: 1280px) { .site-header-inner { padding: 0 2.5rem; } }
    .header-identity { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .header-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .header-text { display: flex; flex-direction: column; gap: 2px; }
    .header-name { font-size: 0.95rem; font-weight: 700; color: #fff; line-height: 1.2; white-space: nowrap; }
    .header-title { font-size: 0.7rem; color: #9ca3af; line-height: 1.2; white-space: nowrap; }
    .header-nav { display: flex; gap: 6px; }
    .header-nav-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 500; color: #9ca3af; text-decoration: none; padding: 6px 14px; border-radius: 9999px; border: 1px solid transparent; transition: color .3s, background .3s, border-color .3s; }
    .header-nav-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
    .header-nav-btn.active { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.15); }
    .header-menu-btn { display: none; background: none; border: 1px solid transparent; color: #9ca3af; cursor: pointer; padding: 6px 10px; border-radius: 9999px; align-items: center; justify-content: center; flex-shrink: 0; transition: color .3s, background .3s, border-color .3s; }
    .header-menu-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
    .header-menu-btn.open { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.15); }
    .header-dropdown { display: none; flex-direction: column; position: absolute; top: calc(100% + 6px); right: 0; background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 14px; overflow: hidden; min-width: 150px; z-index: 300; }
    .header-dropdown.open { display: flex; }
    .header-dropdown-link { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; color: #9ca3af; text-decoration: none; padding: 11px 18px; transition: background .2s, color .2s; }
    .header-dropdown-link:hover { color: #fff; background: rgba(255,255,255,.08); }
    .header-dropdown-link.active { color: #fff; }
    @media (max-width: 600px) {
      .site-header-inner { padding: 0 1rem; height: 74px; }
      .header-avatar { width: 40px; height: 40px; }
      .header-identity { gap: 8px; }
      .header-nav { display: none; }
      .header-menu-btn { display: flex; }
    }

    /* ── Video background ── */
    .video-bg { position: fixed; inset: 0; z-index: 0; }
    .video-bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Overlay: 20% black + 5px blur, fades in on load ── */
    .video-overlay { position: fixed; inset: 0; z-index: 1; background: rgba(0,0,0,0.2); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
    .video-overlay.loaded { opacity: 1; }

    /* ── Page content ── */
    .page-content { position: relative; z-index: 10; padding-top: 64px; }
    @media (max-width: 600px) { .page-content { padding-top: 74px; } }

    /* ── Hero ── */
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4rem 2rem; }
    .hero-text-group { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }

    /* ── Section ── */
    .scroll-section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5rem 2rem; }

    /* ── KomuB text ── */
    .komu-text { font-family: 'KomuB', sans-serif; color: #fff; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.05; text-shadow: 0 2px 8px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.3); }
    .hero-title   { font-size: clamp(2.6rem, 8.5vw, 7.2rem); cursor: pointer; }
    .hero-subtitle{ font-size: clamp(0.65rem, 1.9vw, 1.15rem); letter-spacing: 0.26em; opacity: 0.85; text-shadow: 0 1px 6px rgba(0,0,0,0.5); cursor: pointer; }
    .section-title { font-size: clamp(1.5rem, 4vw, 3.2rem); margin-bottom: 2.8rem; }

    /* ── Word + char structure ── */
    .word       { display: inline-block; white-space: nowrap; }
    .char       { display: inline-block; opacity: 0; transform: translateY(18px); }
    .char-inner { display: inline-block; }

    /* Looping char bounce (applied to .char-inner) */
    @keyframes charBounce {
      0%   { transform: translateY(0); }
      28%  { transform: translateY(-5px); }
      55%  { transform: translateY(1px); }
      75%  { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }
    .char-inner.bouncing { animation: charBounce 0.48s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* ── Button grid ── */
    .btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.6rem;
      align-items: center;
      justify-content: center;
      max-width: 460px;
    }

    /* ── Media buttons (platforms + socials — same shape) ── */
    .media-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px; height: 80px;
      border-radius: 22px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.6s ease, transform 0.6s ease, background 0.22s, border-color 0.22s, box-shadow 0.22s;
    }
    .media-btn img { width: 38px; height: 38px; object-fit: contain; display: block; }
    .media-btn.yt  img { width: 44px; height: 44px; }
    .media-btn.visible { opacity: 1; transform: translateY(0); }
    .media-btn:active  { transform: scale(0.91); transition-duration: 0.07s; }
    @media (hover: hover) {
      .media-btn:hover {
        background: rgba(255,255,255,0.13);
        border-color: rgba(255,255,255,0.26);
        box-shadow: 0 10px 36px rgba(0,0,0,0.58), 0 2px 14px rgba(0,0,0,0.38);
      }
    }

    /* ── Language switcher ── */
    .lang-switcher { position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 500; }
    .lang-globe-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(10,10,10,0.9); border: 1px solid #2a2a2a; color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .2s, background .2s, border-color .2s; backdrop-filter: blur(8px); }
    .lang-globe-btn:hover { color: #fff; border-color: rgba(255,255,255,.2); }
    .lang-dropup { display: none; flex-direction: column; gap: 4px; position: absolute; bottom: calc(100% + 8px); left: 0; background: rgba(10,10,10,0.95); border: 1px solid #2a2a2a; border-radius: 12px; padding: 6px; backdrop-filter: blur(12px); min-width: 54px; }
    .lang-dropup.open { display: flex; }
    .lang-option { display: flex; align-items: center; justify-content: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; background: none; border: none; color: #9ca3af; font-size: 1.1rem; font-family: inherit; transition: background .15s, color .15s; }
    .lang-option:hover { background: rgba(255,255,255,.08); color: #fff; }
    .lang-option.active { color: #fff; background: rgba(255,255,255,.1); }
    .lang-flag       { width: 28px; height: auto; border-radius: 3px; display: block; }
    .lang-globe-flag { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block; }

    /* ── Header profile wipe ── */
    @keyframes hid-wipe-out {
      from { clip-path: polygon(-20% 0%, 120% 0%, 120% 100%, -40% 100%); }
      to   { clip-path: polygon(120% 0%, 120% 0%, 120% 100%, 100% 100%); }
    }
    @keyframes hid-wipe-in {
      from { clip-path: polygon(-120% 0%, -20% 0%, -40% 100%, -120% 100%); }
      to   { clip-path: polygon(-120% 0%, 120% 0%, 100% 100%, -120% 100%); }
    }
  </style>

      'follow-title':   followTitle
    };

    /* ── Split text into .word > .char > .char-inner spans ── */
    function splitIntoChars(el) {
      var text = el.textContent.trim();
      el.innerHTML = '';
      el.setAttribute('aria-label', text);

      var words = text.split(' ');
      words.forEach(function(word, wi) {
        if (wi > 0) el.appendChild(document.createTextNode(' '));
        var wordSpan = document.createElement('span');
        wordSpan.className = 'word';
        word.split('').forEach(function(ch) {
          var outer = document.createElement('span');
          outer.className = 'char';
          var inner = document.createElement('span');
          inner.className = 'char-inner';
          inner.textContent = ch;
          inner.setAttribute('aria-hidden', 'true');
          outer.appendChild(inner);
          wordSpan.appendChild(outer);
        });
        el.appendChild(wordSpan);
      });
    }

    /* ── Show chars: staggered fade-up ── */
    function showChars(el, baseDelayMs) {
      var chars = el.querySelectorAll('.char');
      chars.forEach(function(ch, i) {
        setTimeout(function() {
          ch.style.transition = 'opacity 0.52s cubic-bezier(0.16,1,0.3,1), transform 0.52s cubic-bezier(0.16,1,0.3,1)';
          ch.style.opacity = '1';
          ch.style.transform = 'translateY(0)';
        }, baseDelayMs + i * 40);
      });
    }

    /* ── Hide chars: staggered fade-down ── */
    function hideChars(el) {
      var chars = el.querySelectorAll('.char');
      chars.forEach(function(ch, i) {
        setTimeout(function() {
          ch.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
          ch.style.opacity = '0';
          ch.style.transform = 'translateY(-10px)';
        }, i * 18);
      });
    }

    /* ── Initial split ── */
    [heroTitle, heroSubtitle, discoverTitle, followTitle].forEach(splitIntoChars);

    /* ── Section observer: show/hide text on scroll ── */
    var sectionDefs = [
      { id: 'heroSection',    textEls: [{el: heroTitle, delay: 280}, {el: heroSubtitle, delay: 820}] },
      { id: 'platformSection',textEls: [{el: discoverTitle, delay: 180}] },
      { id: 'socialSection',  textEls: [{el: followTitle, delay: 180}] }
    ];

    var sectionObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        var def = sectionDefs.find(function(d) { return d.id === entry.target.id; });
        if (!def) return;
        def.textEls.forEach(function(item) {
          if (entry.isIntersecting) showChars(item.el, item.delay);
          else                      hideChars(item.el);
        });
      });
    }, { threshold: 0.05 });

    sectionDefs.forEach(function(def) {
      var el = document.getElementById(def.id);
      if (el) sectionObserver.observe(el);
    });

    /* ── Button observer: staggered show/hide ── */
    var btnObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        e.target.classList.toggle('visible', e.isIntersecting);
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.media-btn').forEach(function(btn) { btnObserver.observe(btn); });

    /* ── Looping character bounce every 5 s ── */
    setInterval(function() {
      var allChars = document.querySelectorAll('.char');
      allChars.forEach(function(ch, i) {
        if (parseFloat(ch.style.opacity || '0') < 0.8) return;
        setTimeout(function() {
          var inner = ch.querySelector('.char-inner');
          if (!inner) return;
          inner.classList.remove('bouncing');
          void inner.offsetWidth; /* force reflow to restart animation */
          inner.classList.add('bouncing');
        }, i * 36);
      });
    }, 5000);

    /* ── Overlay fade in ── */
    window.addEventListener('load', function() {
      document.getElementById('videoOverlay').classList.add('loaded');
    });

    /* ── Video background: loop 0:55–1:15 of the source file ──
       Same technique as intro.html — seek currentTime, no FFmpeg needed. ── */
    (function() {
      var v = document.getElementById('bgVideo');
      if (!v) return;
      v.muted = true;

      var START = 55, END = 75; // 0:55 – 1:15

      function tryPlay() {
        var p = v.play();
        if (p) p.catch(function() {});
      }

      v.addEventListener('loadedmetadata', function() {
        v.currentTime = START;
        tryPlay();
      }, { once: true });

      v.addEventListener('timeupdate', function() {
        if (v.currentTime >= END) v.currentTime = START;
      });

      tryPlay();
      v.addEventListener('canplay',    tryPlay, { once: true });
      v.addEventListener('loadeddata', tryPlay, { once: true });
    })();

    /* ── Header menu toggle ── */
    var menuBtn = document.getElementById('headerMenuBtn');
    var menuDD  = document.getElementById('headerDropdown');
    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = menuDD.classList.toggle('open');
      menuBtn.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function() {
      menuDD.classList.remove('open');
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    });

    /* ── Language switcher ── */
    function applyLang(lang) {
      /* Regular nav/header elements */
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (T[lang] && T[lang][key] !== undefined) el.textContent = T[lang][key];
      });

      /* Animated text elements: re-split and re-show */
      Object.keys(translatableAnims).forEach(function(key) {
        var el = translatableAnims[key];
        if (!T[lang] || T[lang][key] === undefined) return;
        el.textContent = T[lang][key];
        splitIntoChars(el);
        showChars(el, 0);
      });

      document.querySelectorAll('.lang-option').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });
      try { localStorage.setItem('lang', lang); } catch(e) {}
      document.documentElement.lang = lang === 'fr' ? 'fr' : 'en';
      var flagEl = document.getElementById('langCurrentFlag');
      if (flagEl) flagEl.src = lang === 'fr' ? 'assets/svg/languages/FRENCH_LANGUAGE.svg' : 'assets/svg/languages/ENGLISH_LANGUAGE.svg';
    }
    window._siteT = T; window._siteApplyLang = applyLang;

    var _initLang = 'en'; try { _initLang = localStorage.getItem('lang') || 'en'; } catch(e) {}
    applyLang(_initLang);

    var globeBtn = document.getElementById('langGlobeBtn');
    var dropup   = document.getElementById('langDropup');
    globeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      dropup.classList.toggle('open');
    });
    document.addEventListener('click', function() { dropup.classList.remove('open'); });
    document.querySelectorAll('.lang-option').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        applyLang(btn.getAttribute('data-lang'));
        dropup.classList.remove('open');
      });
    });

  })();
  </script>

  <script>
  (function() {
    var heroTitle    = document.getElementById('heroTitle');
    var heroSubtitle = document.getElementById('heroSubtitle');
    var target       = document.getElementById('platformSection');
    if (heroTitle && target) heroTitle.addEventListener('click', function() { target.scrollIntoView({ behavior: 'smooth' }); });
    if (heroSubtitle && target) heroSubtitle.addEventListener('click', function() { target.scrollIntoView({ behavior: 'smooth' }); });
  })();
  </script>

  <script>
  (function() {
    var profiles = [
      { src: 'assets/images/avatar.jpg',       name: 'Carl Checrallah', key1: 'header-title-1', key2: 'header-title-2', href: 'intro.html'  },
      { src: 'assets/images/cheux_avatar.png', name: 'CHEUX',           key1: 'cheux-title-1',  key2: 'cheux-title-2',  href: 'cheux.html' }
    ];
    var current = 0;
    var identity = document.getElementById('headerIdentity');
    var avatarEl = document.getElementById('headerAvatarImg');
    var nameEl   = document.getElementById('headerNameSpan');
    var title1El = document.querySelector('[data-i18n="header-title-1"]');
    var title2El = document.querySelector('[data-i18n="header-title-2"]');
    if (!identity || !avatarEl || !nameEl || !title1El || !title2El) return;

    function applyProfile(p) {
      avatarEl.src = p.src;
      nameEl.textContent = p.name;
      identity.href = p.href;
      title1El.setAttribute('data-i18n', p.key1);
      title2El.setAttribute('data-i18n', p.key2);
      var lang = document.documentElement.lang || 'en';
      var t = window._siteT && window._siteT[lang];
      if (t) {
        if (t[p.key1] !== undefined) title1El.textContent = t[p.key1];
        if (t[p.key2] !== undefined) title2El.textContent = t[p.key2];
      }
    }

    var HIDDEN = 'polygon(120% 0%, 120% 0%, 120% 100%, 100% 100%)';
    var DUR = 400;

    function wipeSwap() {
      identity.style.animation = 'none';
      void identity.offsetWidth;
      identity.style.animation = 'hid-wipe-out ' + DUR + 'ms cubic-bezier(0.4,0,0.2,1) forwards';
      setTimeout(function() {
        current = 1 - current;
        identity.style.clipPath = HIDDEN;
        identity.style.animation = 'none';
        applyProfile(profiles[current]);
        void identity.offsetWidth;
        identity.style.animation = 'hid-wipe-in ' + DUR + 'ms cubic-bezier(0.4,0,0.2,1) forwards';
        setTimeout(function() {
          identity.style.animation = '';
          identity.style.clipPath = '';
        }, DUR + 20);
      }, DUR + 10);
    }

    setInterval(wipeSwap, 5000);
  })();
  </script>
</body>
