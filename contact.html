<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carl Checrallah – Contact</title>
  <meta name="description" content="Motion Designer - Art Director">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.css" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Domine';
      src: url('assets/fonts/Domine/Domine-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/Google_Sans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'IBM Plex Sans';
      src: url('assets/fonts/IBM_Plex_Sans/IBMPlexSans-VariableFont_wdth,wght.ttf') format('truetype');
      font-weight: 100 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bento-unit: 150px;
      --bento-gap: 20px;
      --bento-bg: #f5f5f5;
      --bento-widget-bg: #fff;
      --bento-text-primary: #1a202c;
      --bento-text-secondary: #718096;
      --bento-border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 24px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow-x: hidden; }

    body {
      background: #000000;
      background-attachment: fixed;
      font-family: 'IBM Plex Sans', 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--bento-text-primary);
      min-height: 100vh;
    }

    /* ─── Header ─────────────────────────────────────────── */

    .site-header {
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1420px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 64px;
      position: relative;
    }

    @media (min-width: 1280px) {
      .site-header-inner { padding: 0 2.5rem; }
    }

    .header-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .header-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-title {
      font-size: 0.7rem;
      color: #9ca3af;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-menu-btn {
      display: none;
      background: none;
      border: 1px solid transparent;
      color: #9ca3af;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 9999px;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color .3s cubic-bezier(.4,0,.2,1),
                  background .3s cubic-bezier(.4,0,.2,1),
                  border-color .3s cubic-bezier(.4,0,.2,1);
    }
    .header-menu-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
    .header-menu-btn.open {
      color: #fff;
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.15);
    }

    .header-dropdown {
      display: none;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 14px;
      overflow: hidden;
      min-width: 150px;
      z-index: 200;
    }
    .header-dropdown.open { display: flex; }

    .header-dropdown-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #9ca3af;
      text-decoration: none;
      padding: 11px 18px;
      transition: background .2s, color .2s;
    }
    .header-dropdown-link:hover { color: #fff; background: rgba(255,255,255,.08); }
    .header-dropdown-link.active { color: #fff; }

    .header-nav {
      display: flex;
      gap: 6px;
    }

    .header-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #9ca3af;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      transition: color var(--transition), background var(--transition), border-color var(--transition);
    }

    .header-nav-btn:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.08);
    }

    .header-nav-btn.active {
      color: #ffffff;
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
    }

    @media (max-width: 600px) {
      .site-header-inner { padding: 0 1rem; height: 74px; }
      .header-avatar { width: 40px; height: 40px; }
      .header-identity { gap: 8px; }
      .header-nav { display: none; }
      .header-menu-btn { display: flex; }
    }

    /* ─── Background pattern ────────────────────────────── */

    .bg-pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000000;
      pointer-events: none;
      animation: bgBlurIn 1.5s 0.3s ease forwards;
    }

    .bg-row {
      width: 100%;
      height: 105px;
      background-image: url('assets/svg/bg_pattern.svg');
      background-repeat: repeat-x;
      background-size: 251.5px 80px;
      background-position-x: 0;
      background-position-y: center;
    }

    .bg-row-fwd { animation: rowScrollFwd 10s linear infinite; }
    .bg-row-rev { animation: rowScrollRev 10s linear infinite; }

    @keyframes rowScrollFwd {
      from { background-position-x: 0; }
      to   { background-position-x: 251.5px; }
    }

    @keyframes rowScrollRev {
      from { background-position-x: 0; }
      to   { background-position-x: -251.5px; }
    }

    @keyframes bgBlurIn {
      from { filter: blur(0); }
      to   { filter: blur(2px); }
    }

    /* ─── Page content ────────────────────────────────────── */

    .page-content {
      position: relative;
      z-index: 1;
      max-width: 1420px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    @media (min-width: 1280px) {
      .page-content {
        padding: 2.5rem 2.5rem;
        display: flex;
        justify-content: center;
      }
    }

    /* ─── Widget base ─────────────────────────────────────── */

    .grid-item {
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bento-widget-bg);
      box-shadow: var(--shadow-sm);
      border: 3px solid #ffffff;
      position: relative;
      opacity: 0;
      transform: translateX(var(--slide-x, 60px));
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.16,1,0.3,1), box-shadow var(--transition);
    }

    .grid-item.is-visible {
      opacity: 1;
      transform: translateX(0);
    }

    .grid-item.is-visible:not(.grid-section):hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .grid-section {
      background: #fff;
      border: 3px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1.5rem;
    }

    .grid-section.is-visible:hover {
      box-shadow: var(--shadow-lg);
    }

    .widget-section-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #000000;
      white-space: nowrap;
    }

    /* ─── Enriched card ───────────────────────────────────── */

    .enriched-card {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 10px;
      text-align: center;
    }

    .enriched-favicon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .enriched-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--bento-text-primary);
    }

    .enriched-url {
      font-size: 0.7rem;
      color: var(--bento-text-secondary);
    }

    .enriched-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
    }

    .linkedin-bg {
      background: #0A66C2;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .email-bg {
      background: #EA4335;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .phone-bg {
      background: #374151;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .overlay-link {
      position: absolute;
      inset: 0;
      z-index: 4;
    }

    /* ─── Contact grid ────────────────────────────────────── */

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(6, var(--bento-unit));
      grid-template-rows: 32px repeat(4, var(--bento-unit));
      gap: var(--bento-gap);
    }

    .contact-item-title    { grid-column: 1 / -1;     grid-row: 1 / span 1; }
    .contact-item-email    { grid-column: 1 / span 3; grid-row: 2 / span 2; }
    .contact-item-phone    { grid-column: 4 / span 3; grid-row: 2 / span 2; }
    .contact-item-behance  { grid-column: 1 / span 3; grid-row: 4 / span 2; }
    .contact-item-linkedin { grid-column: 4 / span 3; grid-row: 4 / span 2; }

    @media (max-width: 1279px) {
      .contact-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 24px 120px 120px 120px 120px;
      }
      .contact-item-title    { grid-column: 1 / -1;     grid-row: 1 / span 1; }
      .contact-item-email    { grid-column: 1 / span 2; grid-row: 2 / span 2; }
      .contact-item-phone    { grid-column: 3 / span 2; grid-row: 2 / span 2; }
      .contact-item-behance  { grid-column: 1 / span 2; grid-row: 4 / span 2; }
      .contact-item-linkedin { grid-column: 3 / span 2; grid-row: 4 / span 2; }
    }

    @media (max-width: 600px) {
      .contact-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: unset;
        grid-auto-rows: auto;
        gap: 12px;
      }
      .contact-grid .grid-item {
        grid-column: auto / span 1 !important;
        grid-row: auto / span 1 !important;
        aspect-ratio: 1 / 1;
        height: auto;
      }
      .contact-grid .grid-section {
        grid-column: 1 / -1 !important;
        grid-row: auto / span 1 !important;
        aspect-ratio: unset !important;
        height: auto;
      }
    }

    /* ── Language switcher ── */
    .lang-switcher { position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 500; }
    .lang-globe-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(10,10,10,0.9); border: 1px solid #2a2a2a;
      color: #9ca3af; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s, background .2s, border-color .2s;
      backdrop-filter: blur(8px);
    }
    .lang-globe-btn:hover { color: #fff; border-color: rgba(255,255,255,.2); }
    .lang-dropup {
      display: none; flex-direction: column; gap: 4px;
      position: absolute; bottom: calc(100% + 8px); left: 0;
      background: rgba(10,10,10,0.95); border: 1px solid #2a2a2a;
      border-radius: 12px; padding: 6px; backdrop-filter: blur(12px); min-width: 56px;
    }
    .lang-dropup.open { display: flex; }
    .lang-option {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-radius: 8px;
      cursor: pointer; background: none; border: none;
      color: #9ca3af; font-size: 0.82rem; font-weight: 500;
      font-family: inherit; transition: background .15s, color .15s; white-space: nowrap;
    }
    .lang-option:hover { background: rgba(255,255,255,.08); color: #fff; }
    .lang-option.active { color: #fff; background: rgba(255,255,255,.1); }
    .lang-flag       { width: 28px; height: auto; border-radius: 3px; display: block; }
    .lang-globe-flag { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block; }

    /* ── Header profile wipe ── */
    @keyframes hid-wipe-out {
      from { clip-path: polygon(-20% 0%, 120% 0%, 120% 100%, -40% 100%); }
      to   { clip-path: polygon(120% 0%, 120% 0%, 120% 100%, 100% 100%); }
    }
    @keyframes hid-wipe-in {
      from { clip-path: polygon(-120% 0%, -20% 0%, -40% 100%, -120% 100%); }
      to   { clip-path: polygon(-120% 0%, 120% 0%, 100% 100%, -120% 100%); }
    }
  </style>
</head>

  <script>
    (function() {
      var c = document.getElementById('bgPattern');
      var h = 105;
      var n = Math.ceil(window.innerHeight / h) + 2;
      for (var i = 0; i < n; i++) {
        var d = document.createElement('div');
        d.className = 'bg-row ' + (i % 2 === 0 ? 'bg-row-fwd' : 'bg-row-rev');
        c.appendChild(d);
      }
    })();
  </script>

  <script>
    var cardObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        } else {
          entry.target.classList.remove('is-visible');
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.grid-item').forEach(function(el) {
      var rect = el.getBoundingClientRect();
      var dir = (rect.left + rect.width / 2) < window.innerWidth / 2 ? '-60px' : '60px';
      el.style.setProperty('--slide-x', dir);
      el.style.transitionDelay = (Math.random() * 0.2).toFixed(2) + 's';
      cardObserver.observe(el);
    });
  </script>

  <script>
    (function() {
      var btn = document.getElementById('headerMenuBtn');
      var drop = document.getElementById('headerDropdown');
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = drop.classList.toggle('open');
        btn.classList.toggle('open', isOpen);
        btn.setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', function() {
        drop.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    })();
  </script>

  <script>
    (function() {
      var T = {
        en: {
          'nav-intro': 'Intro', 'nav-projects': 'Projects', 'nav-contact': 'Contact', 'nav-music': 'Music',
          'header-title-1': 'Motion Designer', 'header-title-2': 'Art Director',
          'cheux-title-1': 'Artist', 'cheux-title-2': 'Musician',
          'intro-title': "Hi, I'm Carl",
          'intro-subtitle': "designer, animator, videographer, musician, and actor — passionate about art, design and technology. My job is to make your creative projects come to life.",
          'see-work': 'See my work',
          'card1-title': 'Contact me', 'card1-btn': 'My info',
          'card2-title': 'Are you an artist/designer?', 'card2-sub': 'Join my Discord server!', 'card2-btn': 'Here',
          'card3-title': 'Check out my music',
          'sec-brands': 'Brands', 'sec-port': 'Portfolio / DemoReel',
          'sec-contact': 'Contact Info',
          'contact-email': 'Email', 'contact-phone': 'Phone', 'contact-behance': 'My Behance', 'contact-linkedin': 'My LinkedIn'
        },
        fr: {
          'nav-intro': 'Intro', 'nav-projects': 'Projets', 'nav-contact': 'Contact', 'nav-music': 'Musique',
          'header-title-1': 'Motion Designer', 'header-title-2': 'Directeur Artistique',
          'cheux-title-1': 'Artiste', 'cheux-title-2': 'Musicien',
          'intro-title': 'Salut, je suis Carl',
          'intro-subtitle': "designer, animateur, vidéaste, musicien et acteur — passionné par l'art, le design et la technologie. Mon travail est de donner vie à vos projets créatifs.",
          'see-work': 'Voir mon travail',
          'card1-title': 'Contactez-moi', 'card1-btn': 'Mes infos',
          'card2-title': 'Tu es artiste ou designer ?', 'card2-sub': 'Rejoins mon serveur Discord !', 'card2-btn': 'Ici',
          'card3-title': 'Découvre ma musique',
          'sec-brands': 'Marques', 'sec-port': 'Portfolio / Démo',
          'sec-contact': 'Infos de contact',
          'contact-email': 'E-mail', 'contact-phone': 'Téléphone', 'contact-behance': 'Mon Behance', 'contact-linkedin': 'Mon LinkedIn'
        }
      };
      function applyLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
          var key = el.getAttribute('data-i18n');
          if (T[lang] && T[lang][key] !== undefined) el.textContent = T[lang][key];
        });
        document.querySelectorAll('.lang-option').forEach(function(btn) {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });
        try { localStorage.setItem('lang', lang); } catch(e) {}
        document.documentElement.lang = lang === 'fr' ? 'fr' : 'en';
        var flagEl = document.getElementById('langCurrentFlag');
        if (flagEl) flagEl.src = lang === 'fr' ? 'assets/svg/languages/FRENCH_LANGUAGE.svg' : 'assets/svg/languages/ENGLISH_LANGUAGE.svg';
      }
      window._siteT = T; window._siteApplyLang = applyLang;
      var _initLang = 'en'; try { _initLang = localStorage.getItem('lang') || 'en'; } catch(e) {}
      applyLang(_initLang);
      var globeBtn = document.getElementById('langGlobeBtn');
      var dropup   = document.getElementById('langDropup');
      globeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropup.classList.toggle('open');
      });
      document.addEventListener('click', function() { dropup.classList.remove('open'); });
      document.querySelectorAll('.lang-option').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          applyLang(btn.getAttribute('data-lang'));
          dropup.classList.remove('open');
        });
      });
    })();
  </script>

  <script>
  (function() {
    var profiles = [
      { src: 'assets/images/avatar.jpg',       name: 'Carl Checrallah', key1: 'header-title-1', key2: 'header-title-2', href: 'intro.html'  },
      { src: 'assets/images/cheux_avatar.png', name: 'CHEUX',           key1: 'cheux-title-1',  key2: 'cheux-title-2',  href: 'cheux.html' }
    ];
    var current = 0;
    var identity = document.getElementById('headerIdentity');
    var avatarEl = document.getElementById('headerAvatarImg');
    var nameEl   = document.getElementById('headerNameSpan');
    var title1El = document.querySelector('[data-i18n="header-title-1"]');
    var title2El = document.querySelector('[data-i18n="header-title-2"]');
    if (!identity || !avatarEl || !nameEl || !title1El || !title2El) return;

    function applyProfile(p) {
      avatarEl.src = p.src;
      nameEl.textContent = p.name;
      identity.href = p.href;
      title1El.setAttribute('data-i18n', p.key1);
      title2El.setAttribute('data-i18n', p.key2);
      var lang = document.documentElement.lang || 'en';
      var t = window._siteT && window._siteT[lang];
      if (t) {
        if (t[p.key1] !== undefined) title1El.textContent = t[p.key1];
        if (t[p.key2] !== undefined) title2El.textContent = t[p.key2];
      }
    }

    var HIDDEN = 'polygon(120% 0%, 120% 0%, 120% 100%, 100% 100%)';
    var DUR = 400;

    function wipeSwap() {
      identity.style.animation = 'none';
      void identity.offsetWidth;
      identity.style.animation = 'hid-wipe-out ' + DUR + 'ms cubic-bezier(0.4,0,0.2,1) forwards';
      setTimeout(function() {
        current = 1 - current;
        identity.style.clipPath = HIDDEN;
        identity.style.animation = 'none';
        applyProfile(profiles[current]);
        void identity.offsetWidth;
        identity.style.animation = 'hid-wipe-in ' + DUR + 'ms cubic-bezier(0.4,0,0.2,1) forwards';
        setTimeout(function() {
          identity.style.animation = '';
          identity.style.clipPath = '';
        }, DUR + 20);
      }, DUR + 10);
    }

    setInterval(wipeSwap, 5000);
  })();
  </script>
