<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carl Checrallah</title>
  <meta name="description" content="Motion Designer · Art Director">
  <style>
    @font-face {
      font-family: 'Domine';
      src: url('assets/fonts/Domine/Domine-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/Google_Sans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'IBM Plex Sans';
      src: url('assets/fonts/IBM_Plex_Sans/IBMPlexSans-VariableFont_wdth,wght.ttf') format('truetype');
      font-weight: 100 700;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'IBM Plex Sans', 'Google Sans', system-ui, sans-serif;
    }

    /* ── Header ── */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
    }

    .site-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1420px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 64px;
    }

    @media (min-width: 1280px) { .site-header-inner { padding: 0 2.5rem; } }

    .header-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .header-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .header-text { display: flex; flex-direction: column; gap: 2px; }

    .header-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .header-title { font-size: 0.7rem; color: #9ca3af; line-height: 1.2; }

    .header-nav { display: flex; gap: 6px; }

    .header-nav-btn {
      font-size: 0.8rem;
      font-weight: 500;
      color: #9ca3af;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid transparent;
      transition: color .3s cubic-bezier(.4,0,.2,1),
                  background .3s cubic-bezier(.4,0,.2,1),
                  border-color .3s cubic-bezier(.4,0,.2,1);
    }

    .header-nav-btn:hover { color: #fff; background: rgba(255,255,255,.08); }

    .header-nav-btn.active {
      color: #fff;
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.15);
    }

    @media (max-width: 480px) {
      .site-header-inner { padding: 0 1rem; }
      .header-avatar { width: 40px; height: 40px; }
      .header-identity { gap: 8px; }
      .header-nav { gap: 4px; }
      .header-nav-btn { font-size: 0.72rem; padding: 5px 9px; }
      .title-dash { display: none; }
      .title-line1, .title-line2 { display: block; }
    }

    /* ── Video background
       Blur lives on the container so it persists across double-buffer swaps. ── */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      animation: videoBlurIn 1.8s ease forwards;
    }

    @keyframes videoBlurIn {
      from { filter: blur(0px); }
      to   { filter: blur(8px); }
    }

    .video-bg video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dark scrim */
    .video-dim {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0,0,0,.44);
    }

    /* ── Main layout ── */
    .intro-layout {
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      z-index: 2;
      display: flex;
      align-items: stretch;
    }

    /* ── Text side (left, desktop) ── */
    .text-side {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 3rem 3rem 3rem 5rem;
      animation: fadeInLeft 2s cubic-bezier(0.16,1,0.3,1) both;
    }

    .text-panel {
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 2.5rem 3rem;
      max-width: 520px;
      border: 1px solid rgba(255,255,255,.09);
    }

    .intro-title {
      font-family: 'Domine', Georgia, serif;
      font-size: clamp(2.4rem, 4vw, 4.2rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 1rem;
      letter-spacing: -.01em;
    }

    .intro-subtitle {
      font-family: 'IBM Plex Sans', 'Google Sans', system-ui, sans-serif;
      font-size: clamp(0.88rem, 1.3vw, 1.05rem);
      color: rgba(255,255,255,.7);
      line-height: 1.72;
      margin-bottom: 2.2rem;
    }

    .see-work-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'IBM Plex Sans', 'Google Sans', system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #000;
      background: #fff;
      text-decoration: none;
      padding: 11px 28px;
      border-radius: 999px;
      letter-spacing: .04em;
      transition: background .22s, transform .22s;
    }

    .see-work-btn:hover { background: rgba(255,255,255,.84); transform: translateY(-2px); }
    .see-work-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── Portrait side (right, desktop)
       Absolutely-positioned image — object-fit:cover + object-position:top
       so the face fills the panel and body overflows below. ── */
    .portrait-side {
      width: 60%;
      flex-shrink: 0;
      position: relative;
    }

    .portrait-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      filter:
        grayscale(100%)
        drop-shadow(-28px 0 60px rgba(0,0,0,.9))
        drop-shadow(0 -10px 40px rgba(0,0,0,.6));
      animation: slideFromRight 2s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* ── Entrance animations ── */
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-60px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideFromRight {
      from { opacity: 0; transform: translateX(100vw); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideFromBottom {
      from { opacity: 0; transform: translateY(60vh); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile layout
       Portrait is pushed down (top: 40%) so the face starts below the text
       panel. object-position: top center keeps the face at the top of that
       lower area. Text floats absolutely in the upper portion of the screen,
       above the portrait with no overlap on the face. ── */
    @media (max-width: 768px) {
      /* Portrait occupies the lower portion of the content area */
      .portrait-side {
        position: absolute;
        top: 38%;
        left: 0;
        right: 0;
        bottom: -20%;
        width: 100%;
        height: auto;
        flex-shrink: 0;
      }

      /* Face at the top of the portrait area, body below.
         Slides up from below instead of in from the right. */
      .portrait-img {
        object-position: top center;
        animation: slideFromBottom 2s cubic-bezier(0.16,1,0.3,1) both;
      }

      /* Text floats in the top portion of the screen, above the portrait */
      .text-side {
        position: absolute;
        top: 1.5rem;
        left: 1rem;
        right: 1rem;
        padding: 0;
        flex: none;
        display: block;
        z-index: 5;
      }

      .text-panel {
        padding: 1.4rem 1.6rem;
        max-width: 100%;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- ══════════════ HEADER ══════════════ -->
  <header class="site-header">
    <div class="site-header-inner">
      <a href="intro.html" class="header-identity">
        <img src="assets/images/avatar.jpg" alt="Carl Checrallah" class="header-avatar">
        <div class="header-text">
          <span class="header-name">Carl Checrallah</span>
          <span class="header-title">
            <span class="title-line1">Motion Designer</span><span class="title-dash"> - </span><span class="title-line2">Art Director</span>
          </span>
        </div>
      </a>
      <nav class="header-nav">
        <a href="intro.html"    class="header-nav-btn active">Intro</a>
        <a href="projects.html" class="header-nav-btn">Projects</a>
        <a href="contact.html"  class="header-nav-btn">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ══════════════ VIDEO BACKGROUND
       Two stacked <video> elements. While one plays the other silently
       pre-loads the next clip and seeks to the right position.
       At cut-time only z-index swaps — no src change mid-play — so there
       is never a black frame between shots. ══════════════ -->
  <div class="video-bg">
    <video id="vid-a" muted playsinline></video>
    <video id="vid-b" muted playsinline></video>
  </div>
  <div class="video-dim"></div>

  <!-- ══════════════ CONTENT ══════════════ -->
  <div class="intro-layout">

    <div class="text-side">
      <div class="text-panel">
        <h1 class="intro-title">Hi, I'm Carl</h1>
        <p class="intro-subtitle">Designer, Animator, Videographer, Musician, and Actor&nbsp;&mdash; passionate about art, design and technology. My job is to make your creative projects come to life.</p>
        <a href="projects.html" class="see-work-btn">
          See my work
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="m5.636 19.778l-1.414-1.414L15.657 6.93h-5.586v-2h9v9h-2V8.343z"/>
          </svg>
        </a>
      </div>
    </div>

    <div class="portrait-side">
      <img src="assets/intro/WEBSITE_PORTRAIT.png" alt="Carl Checrallah" class="portrait-img">
    </div>

  </div>

  <script>
    // ── Clip definitions ──────────────────────────────────────────────────
    // pct  → seek to this fraction of the clip's duration (0–1)
    //         so that graphics/logos have fully animated into frame
    // dur  → how many milliseconds to hold this shot before cutting
    //
    // WOMD_RELEASEVERSION gets three windows spread through the middle of
    // the video at 1.6 s each; all other clips play 1.2 s near the end.
    var clips = [
      { src: 'assets/intro/11.mp4',                   pct: 0.80, dur: 1200 },
      { src: 'assets/intro/Comp 1.mp4',               pct: 0.80, dur: 1200 },
      { src: 'assets/intro/Comp 2_1.mp4',             pct: 0.80, dur: 1200 },
      { src: 'assets/intro/Comp 3_1.mp4',             pct: 0.80, dur: 1200 },
      { src: 'assets/intro/intgigs_comp_1.mp4',       pct: 0.80, dur: 1200 },
      { src: 'assets/intro/LOGO ANIMATION 02.mp4',    pct: 0.80, dur: 1200 },
      { src: 'assets/intro/LOGO ANIMATION 2.mp4',     pct: 0.80, dur: 1200 },
      { src: 'assets/intro/WOMD_RELEASEVERSION.mp4',  pct: 0.30, dur: 1600 },
      { src: 'assets/intro/WOMD_RELEASEVERSION.mp4',  pct: 0.50, dur: 1600 },
      { src: 'assets/intro/WOMD_RELEASEVERSION.mp4',  pct: 0.70, dur: 1600 }
    ];

    var N = clips.length;
    var vids = [document.getElementById('vid-a'), document.getElementById('vid-b')];
    var active = 0;    // which vids[] is currently on top / playing
    var showIdx = 0;   // which clips[] is currently visible

    // loadAndPrepare — set src, load, seek to pct * duration once metadata arrives.
    // Called on the standby element 800 ms before it will be needed.
    function loadAndPrepare(vid, clip) {
      vid.src = clip.src;
      vid.addEventListener('loadedmetadata', function handler() {
        vid.removeEventListener('loadedmetadata', handler);
        var t = vid.duration * clip.pct;
        if (isFinite(t) && t > 0) vid.currentTime = t;
      });
      vid.load();
    }

    function cut() {
      var next = 1 - active;
      showIdx = (showIdx + 1) % N;
      var clip = clips[showIdx];

      // Instant z-index swap — standby is already loaded and seeked
      vids[next].style.zIndex = 1;
      vids[active].style.zIndex = 0;
      vids[next].play().catch(function() {});

      active = next;

      // Queue preload of the clip that comes after the one we just showed
      loadAndPrepare(vids[1 - active], clips[(showIdx + 1) % N]);

      setTimeout(cut, clip.dur);
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────
    // Clip 0: seek then play; clip 1: pre-load into standby silently.
    vids[0].style.zIndex = 1;
    vids[1].style.zIndex = 0;

    vids[0].src = clips[0].src;
    vids[0].addEventListener('loadedmetadata', function handler() {
      vids[0].removeEventListener('loadedmetadata', handler);
      var t = vids[0].duration * clips[0].pct;
      if (isFinite(t) && t > 0) vids[0].currentTime = t;
      vids[0].play().catch(function() {});
      setTimeout(cut, clips[0].dur);
    });
    vids[0].load();

    loadAndPrepare(vids[1], clips[1]);
  </script>

</body>
</html>
